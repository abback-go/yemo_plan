# game/ 폴더의 Godot 프로젝트를 웹용으로 빌드해 gh-pages 브랜치에 올린다.
# GitHub Pages(Settings → Pages → Deploy from a branch: gh-pages)가 이 브랜치를 사이트로 공개한다.
name: Web build

on:
  push:
    branches: [main, "cc/**"]
    paths: ["game/**", ".github/workflows/web-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$dest"
          rm templates.tpz

      - name: Write build id into the game (title shows it)
        run: sed -i "s/^const COMMIT := .*/const COMMIT := \"${GITHUB_SHA::7}\"/" game/core/build_info.gd

      - name: Export web build
        run: |
          chmod +x ~/godot/godot
          mkdir -p build/web
          cd game
          ~/godot/godot --headless --import
          ~/godot/godot --headless --export-release "Web" ../build/web/index.html
          test -f ../build/web/index.wasm

      # 홈 화면 웹앱(오프라인): Godot 기본 서비스 워커는 설치할 때 index.wasm·index.pck를 저장하지 않는다.
      # 그러면 첫 접속 뒤 바로 오프라인으로 열거나, 새 버전이 받아진 뒤 오프라인으로 열 때 게임이 안 뜬다.
      # 설치 단계에서 전부 저장하게 바꾼다 (바뀌지 않았으면 실패).
      - name: Cache the whole game on service worker install
        run: |
          sw=build/web/index.service.worker.js
          sed -i 's/cache.addAll(CACHED_FILES)/cache.addAll(FULL_CACHE)/' "$sw"
          grep -q 'cache.addAll(FULL_CACHE)' "$sw"

      - name: Write build info
        run: echo "${GITHUB_REF_NAME} ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)" > build/web/version.txt

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
          commit_message: "Web build ${{ github.ref_name }}"
