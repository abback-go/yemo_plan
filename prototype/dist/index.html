  async function stepTo(nx, ny) {
    const s = G.state;

      G.ui.cat = { x: fx, y: fy };
      G.ui.tween = { fx: G.ui.pos.x, fy: G.ui.pos.y, tx: nx, ty: ny, start: performance.now(), dur: STEP_MS * (G.ui.speed || 1) };

  async function interactHere() {
    const s = G.state;

  // 사건 처리. true = 계속 걸어도 됨
  async function handleEvent(ev, x, y) {
    const s = G.state;

    switch (ev.type) {
      case 'blocked': S.play('error'); return false;
      case 'poisonTick': mapFloat(`-${ev.dmg}`, '#b6f07a'); log(`독이 퍼진다. 체력 -${ev.dmg}`); if (ev.cured) toast('독이 다 빠졌다.', 'good'); return true;
      case 'key': S.play('coin'); toast('녹슨 열쇠를 주웠다!', 'gold'); log('녹슨 열쇠를 주웠다.'); return true;
      case 'trapAvoided': toast('할머니 돋보기로 함정을 알아채고 피했다.', 'good'); return true;
      case 'trap':

        if (ev.kind === 'pit') { mapFloat(`-${ev.dmg}`, '#ff8a9a'); toast(`바닥이 꺼졌다! 체력 -${ev.dmg}`, 'bad'); log(`함정! 체력 -${ev.dmg}`); }
        else { toast('독가시 함정! 독에 걸렸다.', 'bad'); log('독가시 함정에 찔렸다.'); }

      case 'door': return doorEvent(x, y);

      case 'boss': return bossEvent(ev, x, y);
      case 'up': return upEvent();
      case 'down': return downEvent();
      case 'chest': { const loot = R.openChest(s, ev.x, ev.y, ev.treasure); S.play('chest'); await lootSheet(ev.treasure ? '보물 상자를 열었다!' : '상자를 열었다!', loot); return false; }
      case 'lockedChest': return lockedChestEvent(ev);
      case 'mimic': {
        await say([{ who: null, text: '상자를 열려는 순간— 상자가 혀를 날름 내밀었다!' }]);

        return false;

  function runBattle(enemyId, ctx) {
    return new Promise((resolve) => {

        await sleep(500);

  }
  function renderBattle() {
    clearAnims('overlay');
    const B = G.ui.battle;
    const b = B.b;
    $('#overlay').innerHTML = `<div class="battle" id="battle">
      <div class="b-top">
        <div class="b-name">${esc(b.name)}${b.boss ? '<span class="tag">보스</span>' : b.elite ? '<span class="tag elite">의뢰 대상</span>' : ''}</div>
        <div class="bar ehp big" id="b-ehp"><i></i><span></span></div>
        <div class="b-chips" id="b-chips"></div>
      </div>
      <div class="b-stage"><canvas id="enemy-cv"></canvas><div class="floats" id="e-floats"></div><div class="b-intent" id="b-intent"></div></div>
      <div class="b-log" id="b-log"></div>
      <div class="b-me" id="b-me">${sprite('rumi', { shadow: false }, '', true)}<div class="info"><div class="nm"><b>루미 Lv${G.state.player.lv}</b><span id="b-pchips"></span></div>
        <div class="bar hp" id="b-php"><i></i><span></span></div><div class="bar mp" id="b-pmp"><i></i><span></span></div></div><div class="floats" id="p-floats"></div></div>
      <div class="b-cmds" id="b-cmds"></div>
    </div>`;
    paintCanvases($('#overlay'), 'overlay');
    const cv = $('#enemy-cv');
    const k = dpr();
    const stage = $('.b-stage');
    const side = Math.max(160, Math.min(stage.clientWidth * 0.9, stage.clientHeight, 360));
    cv.width = Math.round(side * k); cv.height = Math.round(side * k);
    const ctx = cv.getContext('2d');
    const fn = A.MON[b.enemyId];
    const scale = D.ENEMIES[b.enemyId].scale || 1;
    addAnim('overlay', (t) => {
      const fx = B.fx;
      const w = cv.width, h = cv.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const now = performance.now();
      const appear = Math.min(1, (now - fx.appear) / 350);
      const sh = fx.shake > now ? Math.sin(now / 18) * w * 0.025 : 0;
      const size = w * 0.76 * Math.min(1.08, scale * 0.84) * (0.6 + 0.4 * appear);
      ctx.save();
      ctx.globalAlpha = fx.fade * appear;
      ctx.translate((w - size) / 2 + sh, (h - size) / 2 + (1 - appear) * 20);
      ctx.scale(size / 100, size / 100);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      if (b.charging) { const gr = ctx.createRadialGradient(50, 55, 10, 50, 55, 54); gr.addColorStop(0, 'rgba(255,125,71,0)'); gr.addColorStop(0.7, `rgba(255,125,71,${0.18 + Math.sin(t * 10) * 0.08})`); gr.addColorStop(1, 'rgba(255,125,71,0)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(50, 55, 54, 0, Math.PI * 2); ctx.fill(); }
      if (b.shield > 0) { ctx.globalAlpha = 0.5; ctx.strokeStyle = '#9b7be0'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(50, 55, 50 + Math.sin(t * 4) * 2, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = fx.fade * appear; }
      fn(ctx, b.frozen > 0 || b.sleep > 0 ? t * 0.2 : t);
      if (b.frozen > 0) { ctx.globalAlpha = 0.35; ctx.fillStyle = '#bfe6ff'; ctx.fillRect(0, 0, 100, 100); }
      ctx.restore();
      if (fx.flash > now) {
        ctx.save(); ctx.globalCompositeOperation = 'source-atop'; ctx.globalAlpha = 0.7 * ((fx.flash - now) / 160); ctx.fillStyle = fx.flashColor || '#fff'; ctx.fillRect(0, 0, w, h); ctx.restore();
      }
      // 파티클
      fx.parts = fx.parts.filter((p) => now - p.start < p.life);
      for (const p of fx.parts) {
        const q = (now - p.start) / p.life;
        ctx.globalAlpha = 1 - q;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x * w + p.vx * q * w, p.y * h + p.vy * q * h, p.r * k * (1 - q * 0.5), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
    updateBattleHUD();
    renderCmds();
  }
  function burst(color, n, spread) {
    const fx = G.ui.battle && G.ui.battle.fx; if (!fx) return;

      const a = Math.random() * Math.PI * 2, sp = (spread || 0.35) * (0.4 + Math.random());
      fx.parts.push({ x: 0.5, y: 0.52, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + Math.random() * 4, color, start: now, life: 500 + Math.random() * 300 });
    }
  }

  async function doAction(action) {

    const chk = R.canAct(G.state, B.b, action);
    if (!chk.ok) { toast(chk.reason, 'bad'); S.play('error'); return; }
    B.busy = true; B.menu = 'main'; renderCmds();
    const ev = R.playerAction(G.state, B.b, action);

  async function playEvents(evs) {
    const B = G.ui.battle;
    const now = () => performance.now();
    for (const e of evs) {
      switch (e.t) {
        case 'act':
          if (e.who === 'player' && e.kind === 'spell') {
            const col = { fire: '#ff9a52', ice: '#9fdcff', light: '#ffe680' }[e.elem] || '#9fe0bf';
            S.play(e.spell === 'heal' ? 'heal' : e.elem);
            if (e.elem) burst(col, 18, 0.45);
            await sleep(180);
          } else if (e.who === 'player' && e.kind === 'item') { S.play('heal'); await sleep(120); }
          else if (e.who === 'enemy') { await sleep(240); }
          break;
        case 'dmg':
          if (e.target === 'enemy') {
            B.fx.shake = now() + 260; B.fx.flash = now() + 160; B.fx.flashColor = '#fff';
            S.play(e.amount >= 25 ? 'crit' : 'hit');
            floatAt('enemy', String(e.amount), e.shielded ? 'small' : '');
            burst('#ffffff', 6, 0.2);
          } else {
            S.play('hurt');
            floatAt('player', '-' + e.amount, e.poison ? 'small' : '');
            const me = $('#b-me'); if (me) { me.classList.remove('hurt'); void me.offsetWidth; me.classList.add('hurt'); }
            if (e.big) { const bt = $('#battle'); if (bt) { bt.classList.remove('shake'); void bt.offsetWidth; bt.classList.add('shake'); } }
          }
          updateBattleHUD();
          await sleep(330);
          break;
        case 'miss': floatAt('enemy', '빗나감', 'miss'); S.play('error'); await sleep(250); break;
        case 'crit': floatAt('enemy', '치명타!', 'crit'); break;
        case 'weak': floatAt('enemy', '약점!', 'weak'); break;
        case 'heal': floatAt(e.target, '+' + e.amount, 'heal'); updateBattleHUD(); await sleep(260); break;
        case 'mp': floatAt('player', '+' + e.amount, 'mp'); updateBattleHUD(); await sleep(200); break;
        case 'status': updateBattleHUD(); await sleep(120); break;
        case 'charge': S.play('charge'); updateBattleHUD(); await sleep(260); break;
        case 'shield': burst('#9b7be0', 20, 0.5); updateBattleHUD(); await sleep(300); break;
        case 'shieldBreak': burst('#ffe680', 24, 0.6); updateBattleHUD(); await sleep(250); break;
        case 'pet': S.play('meow'); floatAt('enemy', '냥냥펀치!', 'weak'); await sleep(200); break;
        case 'log': blog(e.text); await sleep(200); break;
        case 'win': burst('#ffcf5a', 30, 0.6); B.fx.fadeStart = now(); fadeEnemy(); break;
        case 'lose': break;
        case 'flee': break;
        case 'deny': toast(e.text, 'bad'); break;
        default: break;
      }
    }
  }

    const f = () => { if (!G.ui.battle) return; const p = (performance.now() - start) / 600; B.fx.fade = Math.max(0, 1 - p); if (p < 1) requestAnimationFrame(f); };

        const t0 = performance.now();
        addAnim('sheet', (t) => {
          const p = Math.min(1, (performance.now() - t0) / 900);
          const w = cv.width;
          ctx.clearRect(0, 0, w, w);

        });

  async function fieldTap(x, y) {
    const s = G.state;

    const f = s.field;
    if (x === f.x && y === f.y) { toast(F.cur(s).name); return; }
    if (!F.revealed(s, x, y)) { toast('어둠에 가려 보이지 않는다.'); S.play('error'); return; }
    const obj = F.objectAt(s, x, y);
    if (obj && obj.kind !== 'monster') {
      const p = F.pathToObject(s, obj);
      if (!p) { toast('그쪽으로 갈 길이 없다.'); S.play('error'); return; }
      const ok = await walk(p);
      if (ok && G.ui.screen === 'field' && F.cur(s).id === a.id) await interact(obj);
      return;
    }
    if (F.cartAt(s, x, y)) {
      if (Math.abs(x - f.x) + Math.abs(y - f.y) === 1) { await walk([[x, y]]); return; }
      toast('책수레 바로 옆에 서서 수레를 누르거나 십자 버튼으로 밀자.');
      return;

      if (G.ui.fcancel) { done = false; break; }
      const cont = await stepTo(nx, ny);
      if (G.ui.fpath) G.ui.fpath.shift();
      if (!cont) { done = false; break; }
    }
    G.ui.fpath = null;
    G.ui.busy = false;
    save();
    refreshField();

        const r = F.openLibChest(s);
        if (!r.ok) { toast(r.text); return; }
        S.play('chest'); await lootSheet('금서 칸 상자를 열었다!', r.loot); save(); return;
      }
      case 'hintbook':
        await ask({ title: '『정원 분수의 비밀』', art: sprite('book', {}, '', false), body: '<p>「분수 둘레 네 룬 판은 밤에서 낮, 낮에서 밤으로 흐르는 하늘을 따라 밟을 것.」</p><p><b>처음엔 ☾ 달, 다음은 ☀ 해, 셋째는 ★ 별, 마지막은 ☁ 구름.</b></p><p class="tiny dim">「…순서가 맞으면 우물이 열린다.」 — 옛 사서의 메모</p>', choices: [{ label: '기억했다', value: 1, cls: 'primary' }] });
        return;
      case 'well': {
        const r = F.useWell(s);
        if (!r.ok) { toast(r.text); return; }
        S.play('chest'); await lootSheet('우물 바닥에서 달빛에 싸인 골동품을 건졌다!', r.loot); R.checkBadges(s).forEach(badgeToast); save(); return;
      }
      case 'shed': {
        const r = F.useShed(s);
        if (r.first) R.checkBadges(s).forEach(badgeToast);
        if (r.qid) { const q = R.questDef(r.qid); S.play('chest'); await say(q.found.map((text) => ({ who: null, text }))); toast('의뢰 목표 달성! 부실 정화대로 가자.', 'gold'); }
        else { if (r.silver) S.play('coin'); await ask({ title: '미로 한가운데 오두막', art: sprite('shed', {}, '', true), body: `<p>${esc(r.text)}</p>`, choices: [{ label: '확인', value: 1, cls: 'primary' }] }); }
        save(); refreshField(); return;
      }
      default: break;
    }
    if (o.id.startsWith('mchest:')) {
      const r = F.openMazeChest(s, o.x, o.y);
      if (!r.ok) { toast(r.text); return; }
      S.play('chest'); await lootSheet('상자를 열었다!', r.loot); save(); return;
    }
    if (F.SEARCH[o.id]) {
      const r = F.search(s, o.id);
      if (r.found) S.play('chest'); else if (r.silver) S.play('coin'); else S.play('tap');
      const extra = [];
      if (r.silver) extra.push(`은화 +${r.silver}`);
      if (r.item) extra.push(`${D.ITEMS[r.item].name} 획득`);
      await ask({ title: `${o.label} 살펴보기`, art: sprite(o.sprite, { mine: false }, '', true), body: `<p>${esc(r.text)}</p>${extra.length ? `<p class="small" style="color:var(--gold)">${extra.join(' · ')}</p>` : ''}`, choices: [{ label: '확인', value: 1, cls: 'primary' }] });
      save(); refreshField();
    }
  }
  async function bedSheet() {
    const s = G.state;
    const st = R.stats(s);
    const c = await ask({ title: '부실 침대', art: sprite('bed', {}, '', false), body: `<p>한숨 자고 내일을 맞을까? 마력이 가득 차고, 체력이 최대치의 ${Math.round(D.TUNING.sleepHealPct * 100)}% 회복된다.</p><p class="tiny dim">하루가 지나면 새 손님이 오고, 밤의 미로 길이 바뀐다. 지금 체력 ${s.player.hp}/${st.maxHp} · 마력 ${s.player.mp}/${st.maxMp}</p>`, choices: [{ label: '잔다 (하루 지남)', value: 'sleep', cls: 'primary' }, { label: '아직', value: null }] });
    if (c !== 'sleep') return;
    const r = R.sleepDay(s);
    S.play('heal');
    save(); render();
    const n = R.customers(s).length;
    toast(`${s.day}일째 아침. 체력 +${r.hp}, 마력 가득!${n ? ` 손님 ${n}명이 와 있다.` : ''}`, 'good');
    await maybeEnding();
  }

  // ───────── 마법 수업 ─────────
  async function classSheet(cls) {
    const s = G.state;
    const C = D.CLASSES[cls];
    const teacher = C.teacher;
    const lines = D.LINES[teacher];
    if (!R.classOpen(s, cls)) {
      await say([{ who: teacher, text: lines[1] }]);
      return;
    }
    const ids = R.classSpells(cls);
    while (true) {
      const rows = ids.map((id) => {
        const sp = D.SPELLS[id];
        const known = s.spells.includes(id);
        const chk = R.canLearn(s, id);
        const state = known ? '<span class="chip good">배움</span>' : chk.ok ? '<span class="chip weak">수강 가능</span>' : `<span class="chip">${esc(chk.reason)}</span>`;
        return { id, known, ok: chk.ok, html: `<div class="card small"><b>${sp.name}</b> <span class="dim">마력 ${sp.mp} · Lv${sp.learn}~ · 수강료 ${sp.tuition ? sp.tuition + '은화' : '무료'} · 룬 ${sp.seq}개</span> ${state}<div class="tiny muted">${esc(sp.desc)}</div></div>` };
      });
      const c = await ask({
        title: C.name, art: portrait(teacher, '', true),
        body: `<p class="small muted">"${esc(lines[Math.floor(Math.random() * lines.length)])}"</p><p class="tiny dim">${esc(C.desc)} 수강료는 합격해야 낸다. 보유 은화 ${s.silver}</p>${rows.map((r) => r.html).join('')}`,
        vertical: true,
        choices: rows.filter((r) => !r.known).map((r) => ({ label: `「${D.SPELLS[r.id].name}」 수업 듣기`, value: r.id, cls: r.ok ? 'primary' : '', disabled: !r.ok })).concat([{ label: '교실을 나선다', value: null, cls: 'ghost' }]),
      });
      if (!c) return;
      const passed = await runeLesson(c, cls);
      if (passed) {
        const r = R.learnSpell(s, c);
        if (r.ok) {
          S.play('levelup');
          save();
          await ask({ title: `새 마법: ${r.spell.name}`, art: sprite('rumi', { shadow: false }, '', true), body: `<p>${esc(r.spell.desc)}</p><p class="small muted">마력 ${r.spell.mp} · 전투의 「마법」 메뉴에서 쓸 수 있다.${r.spell.tuition ? ` 수강료 ${r.spell.tuition}은화를 냈다.` : ''}</p>`, choices: [{ label: '좋아!', value: 1, cls: 'primary' }] });
          R.checkBadges(s).forEach(badgeToast);
          save(); refreshField();
        }
      }
    }
  }
  // 룬 따라 그리기: 보여준 순서대로 룬을 누른다. 반환 true = 합격
  function runeLesson(spellId, cls) {
    const sp = D.SPELLS[spellId];
    return new Promise((resolve) => {
      G.ui.rune = { seq: R.runeSequence(sp.seq), i: 0, phase: 'intro', lit: -1, resolve, speed: cls === 'advanced' ? 430 : 620, spell: sp, tries: 0 };
      renderRune();
    });
  }
  function renderRune(msg) {
    const P = G.ui.rune; if (!P) return;
    const btns = D.RUNES.map((r) => `<button class="rune ${P.lit === r.id ? 'lit' : ''}" style="--rc:${r.color}" data-act="rune" data-arg="${r.id}" ${P.phase === 'input' ? '' : 'disabled'} aria-label="${r.name} 룬"><span>${r.glyph}</span><small>${r.name}</small></button>`).join('');
    const dots = P.seq.map((_, i) => `<i class="${P.phase === 'input' && i < P.i ? 'on' : ''}"></i>`).join('');
    const head = P.phase === 'intro' ? `칠판에 룬 <b>${P.seq.length}개</b>가 차례로 빛난다. 순서를 외워서 똑같이 누르자.`
      : P.phase === 'show' ? '<b>잘 봐!</b> 룬이 빛나는 순서를 외우자…'
        : P.phase === 'input' ? '<b>이제 네 차례.</b> 같은 순서로 룬을 누르자.' : '';
    openSheet({
      title: `수업 · ${sp(P).name}`, dismiss: false,
      body: `<p class="small">${msg || head}</p><div class="rune-dots">${dots}</div><div class="runes">${btns}</div>`,
      foot: P.phase === 'intro' ? '<button class="btn primary" data-act="runeStart">시작</button><button class="btn ghost" data-act="runeQuit">그만두기</button>'
        : P.phase === 'fail' ? '<button class="btn primary" data-act="runeStart">다시 도전</button><button class="btn ghost" data-act="runeQuit">그만두기</button>'
          : '<button class="btn ghost" data-act="runeQuit">그만두기</button>',
    });
  }
  const sp = (P) => P.spell;
  async function runeShow() {
    const P = G.ui.rune; if (!P) return;
    P.phase = 'show'; P.i = 0; P.lit = -1; renderRune();
    await sleep(500);
    for (const r of P.seq) {
      if (G.ui.rune !== P) return;
      P.lit = r; renderRune(); S.play(['fire', 'ice', 'light', 'heal'][r]);
      await sleep(P.speed);
      P.lit = -1; renderRune();
      await sleep(P.speed * 0.35);
    }
    if (G.ui.rune !== P) return;
    P.phase = 'input'; renderRune();
  }
  ACT.runeStart = () => {
    const P = G.ui.rune; if (!P) return;
    if (P.phase === 'fail') { P.seq = R.runeSequence(P.spell.seq); P.tries += 1; }
    runeShow();
  };
  ACT.rune = (arg) => {
    const P = G.ui.rune; if (!P || P.phase !== 'input') return;
    const r = Number(arg);
    if (r !== P.seq[P.i]) {
      S.play('bad');
      P.phase = 'fail'; P.lit = -1;
      renderRune(`틀렸다! ${P.i + 1}번째는 「${D.RUNES[P.seq[P.i]].name}」 룬이었다. 새 문제로 다시 도전할 수 있다. (수강료는 합격할 때만)`);
      return;
    }
    S.play('tap');
    P.i += 1; P.lit = r;
    renderRune();
    setTimeout(() => { if (G.ui.rune === P && P.phase === 'input') { P.lit = -1; renderRune(); } }, 180);
    if (P.i >= P.seq.length) {
      P.phase = 'done';
      S.play('purify');
      renderRune('<b>합격!</b> 룬이 손끝에서 마법으로 바뀌었다.');
      setTimeout(() => { if (G.ui.rune !== P) return; closeSheet(); G.ui.rune = null; P.resolve(true); }, 700);
    }
  };
  ACT.runeQuit = () => { const P = G.ui.rune; if (!P) return; G.ui.rune = null; closeSheet(); P.resolve(false); };

  // ───────── 버튼 ─────────
  ACT.fmove = (arg) => {
    if (G.ui.busy || G.ui.battle || G.ui.screen !== 'field') return;
    const [dx, dy] = arg.split(',').map(Number);
    const f = G.state.field;
    const tx = f.x + dx, ty = f.y + dy;
    const obj = F.objectAt(G.state, tx, ty);
    if (obj && obj.kind !== 'monster') { interact(obj); return; }
    walk([[tx, ty]]);
  };
  ACT.mazeOut = async () => {
    if (G.ui.busy) return;
    const s = G.state;
    const e = F.cur(s).exits[0];
    const p = F.findPath(s, e.x, e.y);
    if (!p) { toast('돌아가는 길을 모르겠다.'); return; }
    await walk(p);
  };
  ACT.cartReset = () => {
    if (G.ui.busy) return;
    F.resetCarts(G.state);
    S.play('door');
    toast('책수레를 처음 자리로 돌려놓았다.');
    save(); render();
  };

  W.ui.field = { fieldTap, walk, interact, snapField, useExit, classSheet, runeLesson };
})();

/* ── main.js ── */
/* 저주 매입합니다 — 시작점. 아티팩트 뷰어의 갱신(hot reload) 시 진행 상태를 넘겨받는다. */
(function () {
  'use strict';
  const W = globalThis.W;
  let started = false;
  function start(data) {
    if (started) return;
    started = true;
    W.ui.boot(data && data.save);
  }
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') {
      hot.snapshot(() => ({ save: W.game.state ? W.rules.serialize(W.game.state) : null }));
    }
    if (hot && typeof hot.ready === 'function') hot.ready(start);
    else start((hot && hot.data) || {});
  } catch (e) {
    start({});
  }
})();

</script>
</body>
</html>
