<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#1c1428;color:#eee;font:12px sans-serif;margin:8px}
.grid{display:grid;grid-template-columns:repeat(6,130px);gap:6px}
.cell{background:#2a1f36;border-radius:8px;padding:4px;text-align:center}
canvas{display:block;margin:auto}
</style></head><body>
<div class="grid" id="g"></div>
<script src="../src/data.js"></script>
<script src="../src/art.js"></script>
<script>
const names = ['rumi','cat','student','batgranny','mummy','cat2','portraits','letter','scroll',
 ...Object.keys(W.art.MON), ...Object.keys(W.art.ICON)];
const g = document.getElementById('g');
for (const n of names) {
  const d = document.createElement('div'); d.className='cell';
  const c = document.createElement('canvas'); c.width=240; c.height=240; c.style.width='120px'; c.style.height='120px';
  const ctx = c.getContext('2d');
  const opts = {t: 1.0, shadow: true};
  if (n==='student') opts.npc = W.DATA.NPCS.noeul, opts.mood='worried';
  W.art.draw(ctx, n, 0, 0, 240, opts);
  d.appendChild(c); d.appendChild(document.createTextNode(n)); g.appendChild(d);
}
</script></body></html>
