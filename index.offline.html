<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YEMO — 오프라인</title>
<style>
	html, body { margin: 0; height: 100%; background: #14101f; color: #e8e0f0; font-family: sans-serif; }
	main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 0 16px; text-align: center; }
	h1 { color: #e8b04a; font-size: 1.4em; }
	p { line-height: 1.6; max-width: 32em; }
	button { margin-top: 1em; padding: 0.6em 1.6em; font-size: 1em; background: #4b3580; color: #fff; border: 0; border-radius: 6px; }
</style>
</head>
<body>
<main>
	<h1>인터넷 연결이 필요해요</h1>
	<p>이 기기에 게임 파일이 아직 다 저장되지 않았거나, 브라우저가 저장 공간을 비우면서 지웠어요.<br>
	인터넷에 연결된 상태에서 한 번 열면 다시 저장되고, 그다음부터는 인터넷 없이 실행됩니다.</p>
	<button onclick="window.location.reload()">다시 시도</button>
</main>
</body>
</html>
